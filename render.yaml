services:
  - type: web
    name: let-2d-platformer
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      # PIN the teacher types on the login screen to open minigame parties. Set it in the Render dashboard.
      - key: TEACHER_PIN
        sync: false
