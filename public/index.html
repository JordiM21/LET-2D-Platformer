<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LET Platformer</title>
<style>
  html,body{margin:0;height:100%;background:#1b1f3b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;background:#1b1f3b}
  #menu input,#menu button{font-size:20px;padding:10px 14px;border-radius:8px;border:0}
  #menu button{background:#ffd23f;cursor:pointer}
  #game{position:fixed;inset:0;display:none}
  #touch{position:fixed;bottom:16px;left:0;right:0;display:none;justify-content:space-between;padding:0 16px;z-index:4;pointer-events:none}
  #touch button{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:0;background:rgba(255,255,255,.35);color:#fff;font-size:34px;touch-action:none;user-select:none}
  #touch .dpad{display:flex;gap:12px}
</style>
</head>
<body>
<div id="menu">
  <h1>LET Platformer</h1>
  <input id="name" maxlength="12" placeholder="Tu nombre" autofocus>
  <button id="play">Jugar</button>
  <small>Flechas o A/D para moverte, Espacio, W o ↑ para saltar</small>
</div>
<div id="game"></div>
<div id="touch">
  <div class="dpad"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <button data-k="jump">▲</button>
</div>
<script src="/vendor/phaser.min.js"></script>
<script type="module" src="/main.js"></script>
</body>
</html>
